<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffb800"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JOON Mail"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>JOON Mail Sender</title><script src="https://accounts.google.com/gsi/client" async defer></script></head><body><main><header><img src="icon-192.png" alt=""><div><h1>JOON Mail Sender</h1><small>내 정보는 내 기기에 저장</small></div></header><section class="panel"><h2>Gmail 연결</h2><label for="clientId">Google OAuth 웹 클라이언트 ID</label><input id="clientId" placeholder="12345-...apps.googleusercontent.com" autocomplete="off"><div class="actions"><button id="saveConfig" class="secondary">설정 저장</button><button id="connect">Gmail 연결</button></div><p id="authStatus" class="muted">미연결 · 구글 OAuth 설정이 필요합니다.</p></section><section class="panel"><h2>메일 작성</h2><label for="to">받는 사람 (여러 명은 쉼표 구분)</label><input id="to" type="text" inputmode="email" placeholder="example@gmail.com"><label for="subject">제목</label><input id="subject" placeholder="제목 입력"><label for="body">본문</label><textarea id="body" rows="8" placeholder="본문 입력"></textarea><label for="files">첨부파일 선택</label><input id="files" type="file" multiple><div id="attachments" class="attachments">저장된 첨부 없음</div><div class="actions"><button id="save" class="secondary">내용·첨부 저장</button><button id="clear" class="secondary">새 메일</button></div><p class="muted">첨부파일은 휴대폰 브라우저 저장소(IndexedDB)에 저장됩니다. 데이터 삭제 시 없어질 수 있으므로 백업하세요.</p></section><section class="panel"><h2>발송 방식 선택</h2><label class="choice"><input type="radio" name="mode" value="send" checked><span><b>1. 바로 전송</b><small>앱에서 Gmail API로 즉시 전송</small></span></label><label class="choice"><input type="radio" name="mode" value="draft"><span><b>2. Gmail에서 확인</b><small>첨부 포함 초안을 저장하고 Gmail 임시보관함에서 직접 발송</small></span></label><button id="submit" class="primary">전송 진행</button><p id="status" role="status" aria-live="polite"></p></section><section class="panel"><h2>저장된 메일과 백업</h2><div class="actions"><button id="export" class="secondary">전체 백업 JSON</button><label class="fileBtn">백업 복원<input type="file" id="restore" accept="application/json,.json" hidden></label></div><h3>기기 내 발송 기록</h3><ul id="history"></ul><p class="muted">기록은 기기의 성공 응답을 기준으로 저장됩니다. Gmail의 실제 발송 여부는 보낸편지함에서 최종 확인하세요.</p></section><footer>v0.1 · Gmail API · 무료 PWA</footer></main><dialog id="confirmDialog"><form method="dialog"><h2 id="confirmTitle">발송 확인</h2><div id="confirmInfo"></div><div class="actions"><button value="cancel" class="secondary">취소</button><button id="confirmOk" value="ok">확인</button></div></form></dialog><script src="app.js"></script></body></html>
